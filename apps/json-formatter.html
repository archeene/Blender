<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Formatter + Validator</title>
<style>
  :root{--bg:#0f1012;--panel:#17191c;--line:#2a2d31;--fg:#e3e1dd;--dim:#8b8d91;--orange:#d4805c;--green:#7fd99a;--red:#e08a8a;}
  *{box-sizing:border-box}
  body{margin:0;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;background:var(--bg);color:var(--fg);font-size:14px;line-height:1.5}
  .wrap{max-width:980px;margin:0 auto;padding:24px 18px 60px}
  h1{font-size:18px;letter-spacing:1px;color:var(--orange);margin:0 0 2px}
  .sub{color:var(--dim);font-size:12px;margin:0 0 18px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  button{font-family:inherit;font-size:12.5px;background:var(--panel);color:var(--fg);border:1px solid var(--line);
    border-radius:7px;padding:7px 13px;cursor:pointer;letter-spacing:.4px}
  button:hover{border-color:var(--orange);color:var(--orange)}
  button.primary{background:var(--orange);color:#1a1207;border-color:var(--orange);font-weight:600}
  button.primary:hover{filter:brightness(1.08);color:#1a1207}
  .indent{margin-left:auto;color:var(--dim);font-size:12px;display:flex;gap:6px;align-items:center}
  select{font-family:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
  .panes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .pane{display:flex;flex-direction:column}
  .pane label{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
  textarea{width:100%;min-height:420px;resize:vertical;background:var(--panel);color:var(--fg);border:1px solid var(--line);
    border-radius:9px;padding:13px;font-family:inherit;font-size:13px;line-height:1.55;tab-size:2}
  textarea:focus{outline:none;border-color:var(--orange)}
  pre#out{margin:0;width:100%;min-height:420px;background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:13px;overflow:auto;white-space:pre;font-size:13px;line-height:1.55}
  .status{margin-top:12px;border-radius:9px;padding:11px 14px;border:1px solid var(--line);background:var(--panel);font-size:13px}
  .status.ok{border-color:rgba(127,217,154,.5);color:var(--green)}
  .status.err{border-color:rgba(224,138,138,.55);color:var(--red)}
  .status.idle{color:var(--dim)}
  .stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;color:var(--dim);font-size:11.5px}
  .stats b{color:var(--fg);font-weight:600}
  .tok-key{color:var(--orange)}.tok-str{color:var(--green)}.tok-num{color:#9db4e8}.tok-bool{color:#e0b24c}.tok-null{color:var(--dim)}.tok-punc{color:var(--dim)}
  @media(max-width:680px){.panes{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>JSON Formatter + Validator</h1>
  <p class="sub">Paste JSON, pretty-print or minify, get the exact parse error with line and column. Runs entirely in your browser, offline.</p>

  <div class="bar">
    <button class="primary" id="fmt">Pretty-print</button>
    <button id="min">Minify</button>
    <button id="sample">Load sample</button>
    <button id="clear">Clear</button>
    <button id="copy">Copy output</button>
    <span class="indent">indent
      <select id="indent">
        <option value="2" selected>2 spaces</option>
        <option value="4">4 spaces</option>
        <option value="\t">tab</option>
      </select>
    </span>
  </div>

  <div class="panes">
    <div class="pane">
      <label for="in">input</label>
      <textarea id="in" spellcheck="false" placeholder='{"hello":"world","items":[1,2,3]}'></textarea>
    </div>
    <div class="pane">
      <label for="out">output</label>
      <pre id="out" aria-live="polite"></pre>
    </div>
  </div>

  <div class="status idle" id="status">Waiting for input.</div>
  <div class="stats" id="stats"></div>
</div>

<script>
(function(){
  var inEl=document.getElementById('in'),
      outEl=document.getElementById('out'),
      statusEl=document.getElementById('status'),
      statsEl=document.getElementById('stats'),
      indentSel=document.getElementById('indent');

  function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

  // Find line/col for a character offset in the raw text.
  function lineCol(text, pos){
    if(pos==null||pos<0) pos=0;
    if(pos>text.length) pos=text.length;
    var line=1,col=1;
    for(var i=0;i<pos;i++){ if(text[i]==='\n'){line++;col=1;} else col++; }
    return {line:line,col:col};
  }

  // A small, complete JSON tokenizer + recursive-descent validator. It returns the
  // EXACT character offset and a human message of the first structural error, fully
  // independent of the host engine's JSON.parse wording (which varies and, on newer
  // V8, omits any position at all). This is the source of truth for line/col.
  function locate(text){
    var i=0, n=text.length;
    function ws(){ while(i<n && (text[i]===' '||text[i]==='\t'||text[i]==='\n'||text[i]==='\r')) i++; }
    function fail(m){ return {pos:i, message:m}; }
    function value(){
      ws();
      if(i>=n) return fail('unexpected end of input, expected a value');
      var c=text[i];
      if(c==='{') return object();
      if(c==='[') return array();
      if(c==='"') return string();
      if(c==='-'||(c>='0'&&c<='9')) return number();
      if(text.substr(i,4)==='true'){ i+=4; return null; }
      if(text.substr(i,5)==='false'){ i+=5; return null; }
      if(text.substr(i,4)==='null'){ i+=4; return null; }
      return fail("unexpected character '"+c+"', expected a value");
    }
    function string(){
      i++; // opening quote
      while(i<n){
        var c=text[i];
        if(c==='\\'){
          var e=text[i+1];
          if(e===undefined) { i++; return fail('unterminated string escape'); }
          if('"\\/bfnrt'.indexOf(e)>=0){ i+=2; continue; }
          if(e==='u'){
            for(var k=1;k<=4;k++){ var h=text[i+1+k]; if(!h||!/[0-9a-fA-F]/.test(h)){ i=i+1+k; return fail('invalid \\u escape in string'); } }
            i+=6; continue;
          }
          i++; return fail("invalid escape '\\"+e+"' in string");
        }
        if(c==='"'){ i++; return null; }
        if(c==='\n'){ return fail('unterminated string (newline inside string)'); }
        i++;
      }
      return fail('unterminated string');
    }
    function number(){
      var start=i;
      if(text[i]==='-') i++;
      if(text[i]==='0'){ i++; }
      else if(text[i]>='1'&&text[i]<='9'){ while(text[i]>='0'&&text[i]<='9') i++; }
      else { i=start; return fail('invalid number'); }
      if(text[i]==='.'){ i++; if(!(text[i]>='0'&&text[i]<='9')) return fail('invalid number (digits expected after decimal point)'); while(text[i]>='0'&&text[i]<='9') i++; }
      if(text[i]==='e'||text[i]==='E'){ i++; if(text[i]==='+'||text[i]==='-') i++; if(!(text[i]>='0'&&text[i]<='9')) return fail('invalid number (digits expected in exponent)'); while(text[i]>='0'&&text[i]<='9') i++; }
      return null;
    }
    function array(){
      i++; ws();
      if(text[i]===']'){ i++; return null; }
      while(true){
        var v=value(); if(v) return v;
        ws();
        if(text[i]===','){ i++; ws(); continue; }
        if(text[i]===']'){ i++; return null; }
        if(i>=n) return fail("unexpected end of input, expected ',' or ']'");
        return fail("expected ',' or ']' in array, got '"+text[i]+"'");
      }
    }
    function object(){
      i++; ws();
      if(text[i]==='}'){ i++; return null; }
      while(true){
        ws();
        if(text[i]!=='"') return fail(i>=n?"unexpected end of input, expected a string key":"expected a string key, got '"+text[i]+"'");
        var k=string(); if(k) return k;
        ws();
        if(text[i]!==':') return fail(i>=n?"unexpected end of input, expected ':'":"expected ':' after key, got '"+text[i]+"'");
        i++;
        var v=value(); if(v) return v;
        ws();
        if(text[i]===','){ i++; continue; }
        if(text[i]==='}'){ i++; return null; }
        if(i>=n) return fail("unexpected end of input, expected ',' or '}'");
        return fail("expected ',' or '}' in object, got '"+text[i]+"'");
      }
    }
    var err=value();
    if(err) return err;
    ws();
    if(i<n) return fail("unexpected trailing character '"+text[i]+"' after JSON value");
    return null; // no error located (should not happen if JSON.parse threw)
  }
  function parseError(text, e){
    var msg=e.message||String(e);
    var loc=locate(text);
    if(loc){ var lc=lineCol(text,loc.pos); return {line:lc.line,col:lc.col,msg:loc.message,located:true}; }
    // fall back to engine message offsets if our validator somehow found nothing
    var m=msg.match(/position\s+(\d+)/i);
    if(m){ var l2=lineCol(text,parseInt(m[1],10)); return {line:l2.line,col:l2.col,msg:msg,located:true}; }
    return {line:null,col:null,msg:msg,located:false};
  }

  function indentValue(){
    var v=indentSel.value;
    return v==='\\t' ? '\t' : (v==='\t' ? '\t' : parseInt(v,10));
  }

  // Walk a parsed value and count keys, strings, numbers, arrays, etc.
  function tally(v,acc){
    acc.values++;
    if(v===null){acc.nulls++;return;}
    if(Array.isArray(v)){acc.arrays++;v.forEach(function(x){tally(x,acc);});return;}
    var t=typeof v;
    if(t==='object'){acc.objects++;Object.keys(v).forEach(function(k){acc.keys++;tally(v[k],acc);});return;}
    if(t==='string')acc.strings++;
    else if(t==='number')acc.numbers++;
    else if(t==='boolean')acc.bools++;
  }

  // Lightweight syntax highlight of already-valid pretty JSON.
  function highlight(json){
    var out='', i=0, n=json.length;
    while(i<n){
      var c=json[i];
      if(c==='"'){
        var j=i+1, s='"';
        while(j<n){ var d=json[j]; s+=d; if(d==='\\'){ s+=json[j+1]||''; j+=2; continue; } if(d==='"'){ j++; break; } j++; }
        // key if followed (after ws) by a colon
        var k=j; while(k<n && (json[k]===' '||json[k]==='\t')) k++;
        var cls=(json[k]===':')?'tok-key':'tok-str';
        out+='<span class="'+cls+'">'+esc(s)+'</span>'; i=j; continue;
      }
      if(/[-0-9]/.test(c) && (out==='' || /[\s:,\[]$/.test(json.slice(0,i).replace(/<[^>]*>/g,'')))){
        var num=''; while(i<n && /[-+0-9.eE]/.test(json[i])){ num+=json[i]; i++; }
        out+='<span class="tok-num">'+esc(num)+'</span>'; continue;
      }
      if(json.slice(i,i+4)==='true'||json.slice(i,i+5)==='false'){
        var bl=json.slice(i,i+4)==='true'?'true':'false';
        out+='<span class="tok-bool">'+bl+'</span>'; i+=bl.length; continue;
      }
      if(json.slice(i,i+4)==='null'){ out+='<span class="tok-null">null</span>'; i+=4; continue; }
      if('{}[]:,'.indexOf(c)>=0){ out+='<span class="tok-punc">'+esc(c)+'</span>'; i++; continue; }
      out+=esc(c); i++;
    }
    return out;
  }

  function run(mode){
    var text=inEl.value;
    if(!text.trim()){
      outEl.innerHTML=''; setStatus('idle','Waiting for input.'); statsEl.innerHTML=''; return;
    }
    var parsed;
    try{ parsed=JSON.parse(text); }
    catch(e){
      var pe=parseError(text,e);
      outEl.innerHTML='';
      if(pe.located){
        setStatus('err','Invalid JSON at line '+pe.line+', column '+pe.col+' &middot; '+esc(pe.msg));
        showErrorLine(text,pe.line,pe.col);
      }else{
        setStatus('err','Invalid JSON &middot; '+esc(pe.msg)+' (exact position not reported by this browser)');
      }
      statsEl.innerHTML='';
      return;
    }
    var ind=mode==='min'?0:indentValue();
    var pretty=JSON.stringify(parsed, null, ind);
    if(mode==='min') outEl.textContent=pretty;
    else outEl.innerHTML=highlight(pretty);
    setStatus('ok','Valid JSON &middot; '+(mode==='min'?'minified':'formatted'));
    var acc={values:0,objects:0,arrays:0,keys:0,strings:0,numbers:0,bools:0,nulls:0};
    tally(parsed,acc);
    statsEl.innerHTML=
      '<span><b>'+text.length+'</b> input chars</span>'+
      '<span><b>'+pretty.length+'</b> output chars</span>'+
      '<span><b>'+acc.keys+'</b> keys</span>'+
      '<span><b>'+acc.values+'</b> values</span>'+
      '<span><b>'+acc.objects+'</b> objects</span>'+
      '<span><b>'+acc.arrays+'</b> arrays</span>'+
      '<span><b>'+acc.strings+'</b> strings &middot; '+acc.numbers+' nums &middot; '+acc.bools+' bools &middot; '+acc.nulls+' nulls</span>';
  }

  function showErrorLine(text,line,col){
    var lines=text.split('\n');
    var ln=lines[line-1]!=null?lines[line-1]:'';
    var caret=new Array(Math.max(0,col-1)+1).join(' ')+'^';
    outEl.innerHTML='<span class="tok-null">line '+line+':</span>\n'+esc(ln)+'\n'+'<span class="tok-str">'+caret+'</span>';
  }

  function setStatus(kind,html){ statusEl.className='status '+kind; statusEl.innerHTML=html; }

  document.getElementById('fmt').onclick=function(){run('fmt');};
  document.getElementById('min').onclick=function(){run('min');};
  document.getElementById('clear').onclick=function(){inEl.value='';run('fmt');inEl.focus();};
  document.getElementById('sample').onclick=function(){
    inEl.value='{\n  "name": "buildforge",\n  "ticker": "BUILD",\n  "gen": 0,\n  "live": true,\n  "apps": ["json-formatter", "unit-converter"],\n  "checks": {"doctype": true, "has_script": true},\n  "owner": null\n}';
    run('fmt');
  };
  document.getElementById('copy').onclick=function(){
    var t=outEl.textContent;
    if(!t){return;}
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t); }
    else{ var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
    setStatus('ok','Output copied to clipboard.');
  };
  indentSel.onchange=function(){ if(inEl.value.trim()) run('fmt'); };
  inEl.addEventListener('input',function(){
    // live validate without reformatting (keeps the user's typing intact)
    var text=inEl.value;
    if(!text.trim()){ setStatus('idle','Waiting for input.'); return; }
    try{ JSON.parse(text); setStatus('ok','Valid JSON &middot; press Pretty-print or Minify'); }
    catch(e){ var pe=parseError(text,e); setStatus('err', pe.located?('Invalid at line '+pe.line+', column '+pe.col+' &middot; '+esc(pe.msg)):('Invalid JSON &middot; '+esc(pe.msg))); }
  });
})();
</script>
</body></html>
