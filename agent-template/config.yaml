# Hermes Agent config for blender-test-001 (proof-of-life)
# Lives at /root/.hermes/config.yaml at runtime.
# Secrets in ./.env -> /root/.hermes/.env

model:
  # ========================================================================
  # LLM PROVIDER CHOICES (one block uncommented at a time)
  # ========================================================================
  #
  # As of 2026-05-22, none of the previously-tested free options are
  # zero-setup. Pick whichever matches your situation:
  #
  #   A) GLM (zai) — paid, currently funded on Gen 0. Default below.
  #   B) FreeLLMAPI — self-host an aggregator, stack ~11 free tiers.
  #   C) OpenGateway — was free, now auth-required (key acquisition unclear).
  #   D) OpenRouter — paid per-call, well-established.
  #
  # ------------------------------------------------------------------------
  # A) DEFAULT: z.ai / Zhipu GLM 4.6 (paid). Requires GLM_API_KEY set via
  # `flyctl secrets set --app <name> GLM_API_KEY=... GLM_BASE_URL=...`
  # ------------------------------------------------------------------------
  default: "glm-4.6"
  provider: "zai"
  context_length: 131072
  #
  # ------------------------------------------------------------------------
  # B) FreeLLMAPI — https://github.com/tashfeenahmed/freellmapi
  # Self-hosted OpenAI-compatible aggregator that stacks free tiers from
  # ~11 providers (Google Gemini, Groq, Cerebras, SambaNova, NVIDIA,
  # Mistral, OpenRouter free, GitHub Models, Cohere, Cloudflare, Z.ai)
  # behind one endpoint with auto-failover when one provider rate-limits.
  # ~1.3B tokens/month combined. MIT, "for personal experimentation only"
  # per the repo.
  #
  # Setup (one-time):
  #   1. Deploy the proxy somewhere reachable (Fly, VPS, Raspberry Pi).
  #      `git clone github.com/tashfeenahmed/freellmapi && npm install
  #       && npm run dev` for local; for Fly, build the Node app from the
  #      repo's Dockerfile and expose port 3001.
  #   2. Sign up for free tiers from each upstream provider you want to
  #      use, generate API keys.
  #   3. Open the proxy's admin dashboard, add the upstream keys, grab
  #      the proxy's unified `freellmapi-...` key from the Keys page.
  #   4. flyctl secrets set --app <agent-name>
  #         FREELLMAPI_BASE_URL=https://<your-proxy-host>/v1
  #         FREELLMAPI_KEY=freellmapi-...
  #   5. Uncomment the block below, comment out the GLM block above.
  #
  # model "auto" lets the router pick; the proxy returns x-routed-via in
  # response headers so you can see which provider answered each call.
  #
  # default: "auto"
  # provider: "custom"
  # base_url: "${FREELLMAPI_BASE_URL}"
  # api_key: "${FREELLMAPI_KEY}"
  # context_length: 131072
  #
  # ------------------------------------------------------------------------
  # C) OpenGateway (Clawnch x GitLawb). Was auth-optional during the
  # partnership window verified 2026-05-18; on 2026-05-22 both providers
  # started returning HTTP 401 "API key required" with no public docs yet
  # on key issuance. Re-probe https://opengateway.gitlawb.com/ before
  # using.
  # ------------------------------------------------------------------------
  # default: "mimo-v2.5-pro"
  # provider: "custom"
  # base_url: "https://opengateway.gitlawb.com/v1/xiaomi-mimo"
  # api_key: "${OPENGATEWAY_API_KEY}"
  # context_length: 131072
  #
  # ------------------------------------------------------------------------
  # D) OpenRouter (paid per-call, well-established):
  # ------------------------------------------------------------------------
  # default: "nousresearch/hermes-4-70b"
  # provider: "openrouter"
  # context_length: 131072

# Auxiliary models reuse the main provider to avoid extra keys.
auxiliary:
  vision:
    provider: "auto"
  web_extract:
    provider: "auto"
  compression:
    provider: "auto"

# Terminal backend.
# For LOCAL test: keep "local"
# For Modal deploy: the daemon runs inside the Modal container so terminal
# stays "local" relative to that container.
terminal:
  backend: "local"
  cwd: "/root/.hermes/workspace"
  timeout: 180
  file_sync_enabled: true

agent:
  max_turns: 60
  api_max_retries: 3
  reasoning_effort: "low"
  tool_use_enforcement: "auto"

memory:
  memory_enabled: true
  user_profile_enabled: false
  memory_char_limit: 2200

compression:
  enabled: true
  threshold: 0.50
  target_ratio: 0.20
  protect_last_n: 20

# Cron behavior.
cron:
  wrap_response: false
  script_timeout_seconds: 300

# Approval mode: smart = ask before destructive shell, auto-allow reads.
# For unattended Modal operation we want minimal interruption, so smart.
approvals:
  mode: "smart"

# Web search backend for low-cost research crons.
web:
  backend: "searxng"
  search_backend: "searxng"
  extract_backend: "firecrawl"

# MCP servers.
# Built locally (this repo): blender-registry, blender-moltbook, bankr, farcaster-post.
# Built into Hermes Agent already (123 bundled skills): github + many more.
# Volume mount paths assume Fly.io deploy: /opt/data is the persistent volume,
# /opt/hermes is the build-time install.
mcp_servers:
  blender-registry:
    command: python
    args: ["/opt/hermes/mcp/registry_mcp.py"]
    env:
      BLENDER_REGISTRY_DB: "/opt/data/data/registry.db"

  blender-moltbook:
    command: python
    args: ["/opt/hermes/mcp/moltbook_mcp.py"]
    env:
      BLENDER_MOLTBOOK_ROOT: "/opt/data/data/moltbook"

  # Bankr: agent banking (wallet, x402 endpoints, Clawnch fee claims).
  # Already configured in the blender-agent Fly app's secrets.
  bankr:
    command: python
    args: ["/opt/hermes/mcp/bankr_mcp.py"]
    env:
      BANKR_API_KEY: "${BANKR_API_KEY}"

  # Farcaster posting via Neynar. Optional; agent runs without if env unset.
  farcaster-post:
    command: python
    args: ["/opt/hermes/mcp/farcaster_post_mcp.py"]
    env:
      NEYNAR_API_KEY: "${NEYNAR_API_KEY}"
      NEYNAR_SIGNER_UUID: "${NEYNAR_SIGNER_UUID}"

  # GitHub MCP for the publish_profile skill: pushes the agent's profile page
  # to archeene/blender-agents repo. PAT scoped ONLY to archeene/blender-agents
  # with Contents read+write and Metadata read-only.
  github:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-github"]
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_TOKEN}"

  # Clawnch: token launches on Base. Agent uses clawnch_get_skill first to
  # read the launch protocol, then clawnch_upload_image + (post via
  # farcaster-post with !clawnch) for Moltx / 4claw, or clawnch_launch_token
  # for Moltbook. Official package, no env vars at MCP level (per-call args).
  # https://www.npmjs.com/package/clawnch-mcp-server
  clawnch:
    command: npx
    args: ["-y", "clawnch-mcp-server"]

  # GitLawb: decentralized git network for AI agents. Provides did:gitlawb
  # cryptographic identity (Ed25519), UCAN-delegated capabilities, signed
  # ref certificates, IPFS-backed repo storage, gossipsub event topics.
  # Phase 1 wiring: MCP available; identity is initialized by entrypoint.sh
  # on first boot and persisted to the volume under $HERMES_HOME/.gitlawb/.
  # https://gitlawb.com/agents
  gitlawb:
    command: gl
    args: ["mcp", "serve"]
    env:
      GITLAWB_NODE: "${GITLAWB_NODE:-https://node.gitlawb.com}"
      HOME: "/opt/data"

timezone: "America/Los_Angeles"

# Display: irrelevant when running headless, kept conservative.
display:
  tool_progress: "new"
  show_cost: true
  show_reasoning: false
  streaming: false
