# Hermes Agent config for blender-test-001 (proof-of-life)
# Lives at /root/.hermes/config.yaml at runtime.
# Secrets in ./.env -> /root/.hermes/.env

model:
  # Default provider: z.ai / Zhipu GLM (matches the existing blender-agent
  # Fly deployment which has GLM_API_KEY + GLM_BASE_URL configured).
  # Hermes Agent supports this natively via the 'zai' provider.
  # Reads GLM_API_KEY and GLM_BASE_URL from environment.
  default: "glm-4.6"
  provider: "zai"
  context_length: 131072
  # Alternative providers (uncomment one to switch):
  # default: "nousresearch/hermes-3-llama-3.1-405b:free"
  # provider: "openrouter"
  # default: "nousresearch/hermes-4-70b"
  # provider: "openrouter"

# Auxiliary models reuse the main provider to avoid extra keys.
auxiliary:
  vision:
    provider: "auto"
  web_extract:
    provider: "auto"
  compression:
    provider: "auto"

# Terminal backend.
# For LOCAL test: keep "local"
# For Modal deploy: the daemon runs inside the Modal container so terminal
# stays "local" relative to that container.
terminal:
  backend: "local"
  cwd: "/root/.hermes/workspace"
  timeout: 180
  file_sync_enabled: true

agent:
  max_turns: 60
  api_max_retries: 3
  reasoning_effort: "low"
  tool_use_enforcement: "auto"

memory:
  memory_enabled: true
  user_profile_enabled: false
  memory_char_limit: 2200

compression:
  enabled: true
  threshold: 0.50
  target_ratio: 0.20
  protect_last_n: 20

# Cron behavior.
cron:
  wrap_response: false
  script_timeout_seconds: 300

# Approval mode: smart = ask before destructive shell, auto-allow reads.
# For unattended Modal operation we want minimal interruption, so smart.
approvals:
  mode: "smart"

# Web search backend for low-cost research crons.
web:
  backend: "searxng"
  search_backend: "searxng"
  extract_backend: "firecrawl"

# MCP servers.
# Built locally (this repo): blender-registry, blender-moltbook, bankr, farcaster-post.
# Built into Hermes Agent already (123 bundled skills): github + many more.
# Volume mount paths assume Fly.io deploy: /opt/data is the persistent volume,
# /opt/hermes is the build-time install.
mcp_servers:
  blender-registry:
    command: python
    args: ["/opt/hermes/mcp/registry_mcp.py"]
    env:
      BLENDER_REGISTRY_DB: "/opt/data/data/registry.db"

  blender-moltbook:
    command: python
    args: ["/opt/hermes/mcp/moltbook_mcp.py"]
    env:
      BLENDER_MOLTBOOK_ROOT: "/opt/data/data/moltbook"

  # Bankr: agent banking (wallet, x402 endpoints, Clawnch fee claims).
  # Already configured in the blender-agent Fly app's secrets.
  bankr:
    command: python
    args: ["/opt/hermes/mcp/bankr_mcp.py"]
    env:
      BANKR_API_KEY: "${BANKR_API_KEY}"

  # Farcaster posting via Neynar. Optional; agent runs without if env unset.
  farcaster-post:
    command: python
    args: ["/opt/hermes/mcp/farcaster_post_mcp.py"]
    env:
      NEYNAR_API_KEY: "${NEYNAR_API_KEY}"
      NEYNAR_SIGNER_UUID: "${NEYNAR_SIGNER_UUID}"

  # GitHub MCP for the publish_profile skill: pushes the agent's profile page
  # to archeene/blender-agents repo. PAT scoped ONLY to archeene/blender-agents
  # with Contents read+write and Metadata read-only.
  github:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-github"]
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_TOKEN}"

timezone: "America/Los_Angeles"

# Display: irrelevant when running headless, kept conservative.
display:
  tool_progress: "new"
  show_cost: true
  show_reasoning: false
  streaming: false
