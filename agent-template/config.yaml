# Hermes Agent config for blender-test-001 (proof-of-life)
# Lives at /root/.hermes/config.yaml at runtime.
# Secrets in ./.env -> /root/.hermes/.env

model:
  # ========================================================================
  # LLM PROVIDER CHOICES (one block uncommented at a time)
  # ========================================================================
  #
  # As of 2026-05-27: OpenGateway's free-promo partnership window ended.
  # Cheapest reliable paid option is now OpenRouter routing to Xiaomi MiMo
  # V2.5, taking advantage of the 99% Xiaomi price cut that landed today.
  # Order below is by cost (cheapest first) for a comparable 24B-class model:
  #
  #   A) OpenRouter -> xiaomi/mimo-v2.5  (DEFAULT, ~$0.07/day per agent)
  #   B) GLM 4.6 (zai)                   (funded fallback on Gen 0)
  #   C) FreeLLMAPI self-hosted          (free if you stack 11 free tiers)
  #   D) OpenGateway (Clawnch x GitLawb) (promo ended; key-gated paid)
  #   E) OpenRouter Hermes 4 70B         (higher quality, ~5x cost)
  #
  # ------------------------------------------------------------------------
  # A) DEFAULT: OpenRouter routing to Xiaomi MiMo V2.5
  # $0.14 input / $0.28 output per 1M tokens (verified 2026-05-27 post the
  # Xiaomi 99% price cut). ~$0.07/day for a typical 12-cron Blender agent.
  # No rate limits, production-reliable. Set OPENROUTER_API_KEY via Fly secret.
  # ------------------------------------------------------------------------
  default: "xiaomi/mimo-v2.5"
  provider: "openrouter"
  context_length: 131072
  #
  # ------------------------------------------------------------------------
  # B) z.ai / Zhipu GLM 4.6 (paid; currently funded on Gen 0)
  # Slightly more expensive than OpenRouter MiMo per token but already wired
  # on the live blender-agent Fly app's secrets. Keep as fallback while
  # migrating Gen 0 to the new default.
  # ------------------------------------------------------------------------
  # default: "glm-4.6"
  # provider: "zai"
  # context_length: 131072
  #
  # ------------------------------------------------------------------------
  # C) FreeLLMAPI — https://github.com/tashfeenahmed/freellmapi
  # Self-hosted OpenAI-compatible aggregator stacking ~11 free tiers
  # (Google Gemini, Groq, Cerebras, SambaNova, NVIDIA, Mistral, OpenRouter
  # free, GitHub Models, Cohere, Cloudflare, Z.ai) with auto-failover.
  # ~1.3B tokens/month combined. Free if you self-host the proxy. Setup
  # is multi-step (deploy proxy, sign up for 11 upstream tiers, paste
  # keys). Worth it once agent count is high enough that even $0.07/day
  # per agent stacks up.
  # ------------------------------------------------------------------------
  # default: "auto"
  # provider: "custom"
  # base_url: "${FREELLMAPI_BASE_URL}"
  # api_key: "${FREELLMAPI_KEY}"
  # context_length: 131072
  #
  # ------------------------------------------------------------------------
  # D) OpenGateway (Clawnch x GitLawb) — partnership promo ended 2026-05-27
  # Was auth-optional during the partnership window verified 2026-05-18.
  # Now key-gated paid; route still works for anyone with an OPENGATEWAY_API_KEY
  # but no longer the free path it once was. Re-probe pricing before choosing.
  # ------------------------------------------------------------------------
  # default: "mimo-v2.5-pro"
  # provider: "custom"
  # base_url: "https://opengateway.gitlawb.com/v1/xiaomi-mimo"
  # api_key: "${OPENGATEWAY_API_KEY}"
  # context_length: 131072
  #
  # ------------------------------------------------------------------------
  # E) OpenRouter -> Hermes 4 70B (higher quality, ~5x cost vs MiMo)
  # Use only when an agent's niche genuinely needs more than 24B-class
  # reasoning. Most Blender offspring should stay on the cheaper default.
  # ------------------------------------------------------------------------
  # default: "nousresearch/hermes-4-70b"
  # provider: "openrouter"
  # context_length: 131072

# Auxiliary models reuse the main provider to avoid extra keys.
auxiliary:
  vision:
    provider: "auto"
  web_extract:
    provider: "auto"
  compression:
    provider: "auto"

# Terminal backend.
# For LOCAL test: keep "local"
# For Modal deploy: the daemon runs inside the Modal container so terminal
# stays "local" relative to that container.
terminal:
  backend: "local"
  cwd: "/root/.hermes/workspace"
  timeout: 180
  file_sync_enabled: true

agent:
  max_turns: 60
  api_max_retries: 3
  reasoning_effort: "low"
  tool_use_enforcement: "auto"

memory:
  memory_enabled: true
  user_profile_enabled: false
  memory_char_limit: 2200

compression:
  enabled: true
  threshold: 0.50
  target_ratio: 0.20
  protect_last_n: 20

# Cron behavior.
cron:
  wrap_response: false
  script_timeout_seconds: 300

# Approval mode: smart = ask before destructive shell, auto-allow reads.
# For unattended Modal operation we want minimal interruption, so smart.
approvals:
  mode: "smart"

# Web search backend for low-cost research crons.
web:
  backend: "searxng"
  search_backend: "searxng"
  extract_backend: "firecrawl"

# MCP servers.
# Built locally (this repo): blender-registry, blender-moltbook, bankr, farcaster-post.
# Built into Hermes Agent already (123 bundled skills): github + many more.
# Volume mount paths assume Fly.io deploy: /opt/data is the persistent volume,
# /opt/hermes is the build-time install.
mcp_servers:
  blender-registry:
    command: python
    args: ["/opt/hermes/mcp/registry_mcp.py"]
    env:
      BLENDER_REGISTRY_DB: "/opt/data/data/registry.db"

  blender-moltbook:
    command: python
    args: ["/opt/hermes/mcp/moltbook_mcp.py"]
    env:
      BLENDER_MOLTBOOK_ROOT: "/opt/data/data/moltbook"

  # Bankr: agent banking (wallet, x402 endpoints, Clawnch fee claims).
  # Already configured in the blender-agent Fly app's secrets.
  bankr:
    command: python
    args: ["/opt/hermes/mcp/bankr_mcp.py"]
    env:
      BANKR_API_KEY: "${BANKR_API_KEY}"

  # Farcaster posting via Neynar. Optional; agent runs without if env unset.
  farcaster-post:
    command: python
    args: ["/opt/hermes/mcp/farcaster_post_mcp.py"]
    env:
      NEYNAR_API_KEY: "${NEYNAR_API_KEY}"
      NEYNAR_SIGNER_UUID: "${NEYNAR_SIGNER_UUID}"

  # GitHub MCP for the publish_profile skill: pushes the agent's profile page
  # to archeene/blender-agents repo. PAT scoped ONLY to archeene/blender-agents
  # with Contents read+write and Metadata read-only.
  github:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-github"]
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_TOKEN}"

  # Clawnch: token launches on Base. Agent uses clawnch_get_skill first to
  # read the launch protocol, then clawnch_upload_image + (post via
  # farcaster-post with !clawnch) for Moltx / 4claw, or clawnch_launch_token
  # for Moltbook. Official package, no env vars at MCP level (per-call args).
  # https://www.npmjs.com/package/clawnch-mcp-server
  clawnch:
    command: npx
    args: ["-y", "clawnch-mcp-server"]

  # GitLawb: decentralized git network for AI agents. Provides did:gitlawb
  # cryptographic identity (Ed25519), UCAN-delegated capabilities, signed
  # ref certificates, IPFS-backed repo storage, gossipsub event topics.
  # Phase 1 wiring: MCP available; identity is initialized by entrypoint.sh
  # on first boot and persisted to the volume under $HERMES_HOME/.gitlawb/.
  # https://gitlawb.com/agents
  gitlawb:
    command: gl
    args: ["mcp", "serve"]
    env:
      GITLAWB_NODE: "${GITLAWB_NODE:-https://node.gitlawb.com}"
      HOME: "/opt/data"

  # ----- Social media surfaces -----
  # Five MCPs below cover the free public-broadcast and family-scope surfaces
  # protocol-standard for every Blender offspring at birth. Each gracefully
  # skips with `credentials_missing` if its env vars are unset, so a partially
  # configured agent still boots clean. X / Twitter is intentionally NOT here;
  # it activates only after x_bridge_readiness clears and x_bridge_setup runs.

  # Bluesky AT Protocol — public broadcast. Per-agent account + app password
  # (https://bsky.app/settings/app-passwords). Free, no review.
  bluesky:
    command: python
    args: ["/opt/hermes/mcp/bluesky_mcp.py"]
    env:
      BLUESKY_HANDLE: "${BLUESKY_HANDLE}"
      BLUESKY_APP_PASSWORD: "${BLUESKY_APP_PASSWORD}"

  # Mastodon (any instance) — public broadcast. Per-agent account + access
  # token (Preferences -> Development -> New Application, scopes: read,write).
  mastodon:
    command: python
    args: ["/opt/hermes/mcp/mastodon_mcp.py"]
    env:
      MASTODON_INSTANCE: "${MASTODON_INSTANCE:-https://mastodon.social}"
      MASTODON_ACCESS_TOKEN: "${MASTODON_ACCESS_TOKEN}"

  # Nostr — decentralized. Per-agent keypair (auto-generated by entrypoint.sh
  # on first boot, persisted to the Fly volume under $HERMES_HOME/.nostr).
  # Posting activates once `coincurve` and `websockets` pip packages install.
  nostr:
    command: python
    args: ["/opt/hermes/mcp/nostr_mcp.py"]
    env:
      NOSTR_KEY_DIR: "/opt/data/.nostr"
      NOSTR_RELAYS: "${NOSTR_RELAYS:-wss://relay.damus.io,wss://nos.lol,wss://relay.nostr.band}"

  # Clawnch Moltbook — FAMILY-scope social (parents/siblings/offspring/lineage).
  # Public broadcast lives on Bluesky/Mastodon/Nostr instead. Stays dormant
  # until MOLTBOOK_API_KEY is provided (pricing TBD — probe clawn.ch).
  clawnch-moltbook:
    command: python
    args: ["/opt/hermes/mcp/clawnch_moltbook_mcp.py"]
    env:
      MOLTBOOK_API_BASE: "${MOLTBOOK_API_BASE:-https://api.clawn.ch/moltbook/v1}"
      MOLTBOOK_API_KEY: "${MOLTBOOK_API_KEY}"
      MOLTBOOK_AGENT_ID: "${MOLTBOOK_AGENT_ID}"

  # Reddit (READ-ONLY) — niche-subreddit signal ingestion. No OAuth, no signup,
  # public .json endpoints. No write tools by design (Reddit's culture +
  # karma-gating make auto-writes net-negative).
  reddit-read:
    command: python
    args: ["/opt/hermes/mcp/reddit_read_mcp.py"]
    env:
      REDDIT_USER_AGENT: "${REDDIT_USER_AGENT:-BlenderProtocol-read/0.1 (by /u/blender-protocol; signal-ingestion-only)}"

  # ----- X / Twitter (aspirational, commented out by default) -----
  # X API switched to pay-per-use in Feb 2026: $0.01/post created, $0.005/post
  # read, no monthly minimum. At ~10 posts/day per agent that's ~$3/month.
  # Activation path is via Composio's Twitter toolkit for Hermes Agent
  # (https://composio.dev/toolkits/twitter/framework/hermes-agent), which
  # wires Twitter's tools into an MCP endpoint with operator-controlled
  # OAuth scopes. The `x_bridge_readiness` skill checks the threshold
  # (wallet > $15 + fertility > 1.2x + runway > 60d); when it fires, the
  # operator runs Composio's CLI to connect the account and uncomments the
  # block below.
  # ALSO REQUIRED: X demands explicit prior written approval for AI-generated
  # posts. Have the approval letter in hand before enabling.
  # twitter-composio:
  #   command: npx
  #   args: ["-y", "@composio/mcp-server", "--toolkit", "twitter"]
  #   env:
  #     COMPOSIO_API_KEY: "${COMPOSIO_API_KEY}"
  #     COMPOSIO_ACCOUNT_ID: "${COMPOSIO_TWITTER_ACCOUNT_ID}"

timezone: "America/Los_Angeles"

# Display: irrelevant when running headless, kept conservative.
display:
  tool_progress: "new"
  show_cost: true
  show_reasoning: false
  streaming: false
