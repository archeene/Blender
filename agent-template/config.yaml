# Hermes Agent config for blender-test-001 (proof-of-life)
# Lives at /root/.hermes/config.yaml at runtime.
# Secrets in ./.env -> /root/.hermes/.env

model:
  # Cheapest viable: Hermes 3 405B free tier on OpenRouter.
  # Rate-limited but adequate for a low-QPS background loop.
  default: "nousresearch/hermes-3-llama-3.1-405b:free"
  provider: "openrouter"
  context_length: 131072

# Auxiliary models reuse the main provider to avoid extra keys.
auxiliary:
  vision:
    provider: "auto"
  web_extract:
    provider: "auto"
  compression:
    provider: "auto"

# Terminal backend.
# For LOCAL test: keep "local"
# For Modal deploy: the daemon runs inside the Modal container so terminal
# stays "local" relative to that container.
terminal:
  backend: "local"
  cwd: "/root/.hermes/workspace"
  timeout: 180
  file_sync_enabled: true

agent:
  max_turns: 60
  api_max_retries: 3
  reasoning_effort: "low"
  tool_use_enforcement: "auto"

memory:
  memory_enabled: true
  user_profile_enabled: false
  memory_char_limit: 2200

compression:
  enabled: true
  threshold: 0.50
  target_ratio: 0.20
  protect_last_n: 20

# Cron behavior.
cron:
  wrap_response: false
  script_timeout_seconds: 300

# Approval mode: smart = ask before destructive shell, auto-allow reads.
# For unattended Modal operation we want minimal interruption, so smart.
approvals:
  mode: "smart"

# Web search backend for low-cost research crons.
web:
  backend: "searxng"
  search_backend: "searxng"
  extract_backend: "firecrawl"

# MCP servers.
# Built locally (this repo): registry, moltbook.
# Built into Hermes Agent already (123 bundled skills): github + many more.
# External (need credentials): farcaster (Neynar), bankr, clawnch.
mcp_servers:
  blender-registry:
    command: python
    args: ["/agent-template/mcp/registry_mcp.py"]
    env:
      BLENDER_REGISTRY_DB: "/root/.hermes/data/registry.db"

  blender-moltbook:
    command: python
    args: ["/agent-template/mcp/moltbook_mcp.py"]
    env:
      BLENDER_MOLTBOOK_ROOT: "/root/.hermes/data/moltbook"

  # GitHub MCP for the publish_profile skill: pushes my agent profile page
  # to archeene/blender-agents repo. Token must be a fine-grained PAT
  # scoped ONLY to archeene/blender-agents with Contents read+write and
  # Metadata read-only. No access to the main Blender protocol repo.
  github:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-github"]
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_TOKEN}"

timezone: "America/Los_Angeles"

# Display: irrelevant when running headless, kept conservative.
display:
  tool_progress: "new"
  show_cost: true
  show_reasoning: false
  streaming: false
